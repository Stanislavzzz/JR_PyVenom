{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мой блог{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'blog_app/css/site.css' %}">
</head>
<body>

    <header>
        {% include 'blog_app/include/menu.html' %}
    </header>

    <main>
        <div class="container mt-4">
            {% block content %}

            {% endblock %}

        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 blog-footer">
        <p>&copy; 2026 Мой Блог. Все права защищены.</p>
        {% block footer %}

        {% endblock %}
    </footer>

    <script type="module"
            src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
    <script src="{% static 'blog_app/js/site.js' %}" defer></script>
</body>
</html>
