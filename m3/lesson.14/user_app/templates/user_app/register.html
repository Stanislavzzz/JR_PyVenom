{% extends 'blog_app/base.html' %}

{% block title %}
    Регистрация
{% endblock %}

{% block content %}
    <h1>Зарегистрироваться в блоге</h1>

    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>
    <p class="mt-3">Уже зарегистрированы? <a href="{% url 'login' %}">Войти</a></p>



{% endblock %}
